<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<link rel="icon" href="/favicon-light.png" type="image/png" media="(prefers-color-scheme: light)" />
		<link rel="icon" href="/favicon-dark.png" type="image/png" media="(prefers-color-scheme: dark)" />
		<script>
			(function() {
				// First visit to the untranslated root: browsers that prefer Chinese
				// go to /zh-CN. The language pills store an explicit pick in
				// localStorage so a chosen language is never overruled. Runs before
				// paint on the prerendered page; search crawlers keep seeing the
				// unprefixed English page. Mirrors global LANGS in SiteNav and
				// SiteFooter, where the pills are defined.
				var path = location.pathname;
				var override = localStorage.getItem('marketing-lang');
				if (path === '/' && !override) {
					var prefs = (navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language]).filter(Boolean);
					var prefersZh = prefs.some(function(entry) {
						return entry.toLowerCase().indexOf('zh') === 0;
					});
					if (prefersZh) {
						location.replace('/zh-CN');
						return;
					}
				}
			})();
		</script>
		<script>
			(function() {
				// Marketing pages are light only. Mirrors isLightOnlyRoute in
				// src/lib/utils/light-only.ts; keep them in sync.
				const host = location.hostname;
				const path = location.pathname;
				if (!/^(docs|app)\./.test(host) && (path === '/' || /^\/(zh-CN|blog|download|privacy|terms)(\/|$)/.test(path))) {
					return;
				}
				const colorMode = localStorage.getItem('colorMode') || 'system';
				let shouldBeDark;
				if (colorMode === 'system') {
					shouldBeDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
				} else {
					shouldBeDark = colorMode === 'dark';
				}
				if (shouldBeDark) {
					document.documentElement.classList.add('dark');
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
